model_name_or_path: /home/yaodong/codes/deepLearning/partb/Qwen2.5-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
dataset: DISC-LAW-Pair,DISC-LAW-Pair-QA,DISC-LAW-Triplet,DISC-LAW-Triplet-QA
template: qwen
cutoff_len: 2048
max_samples: 500
overwrite_cache: true
preprocessing_num_workers: 16
